<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410">
  <style>
    .sans { font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .label { font-size: 10.5px; letter-spacing: 2px; fill: #71717a; }
    .k { font-size: 12px; fill: #71717a; }
    .v { font-size: 14.5px; font-weight: 600; fill: #fafafa; }
    .chip { fill: none; stroke: #2e2e33; }
    .packet { animation: travel 3.6s cubic-bezier(.6,0,.4,1) infinite; }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0 } 8% { opacity: 1 } 92% { opacity: 1 } 100% { transform: translateX(360px); opacity: 0 } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  </style>

  <!-- PSOC -->
  <rect x="0.5" y="0.5" width="519" height="219" rx="18" fill="#111113" stroke="#26262a"/>
  <text x="28" y="40" class="mono label">MAIN PROJECT</text>
  <circle class="pulse" cx="404" cy="36" r="3" fill="#4ade80"/>
  <text x="414" y="40" class="mono" font-size="10.5" letter-spacing="1" fill="#a1a1aa">IN PROGRESS</text>

  <text x="27" y="86" class="sans" font-size="32" font-weight="700" letter-spacing="-1" fill="#fafafa">PSOC</text>
  <text x="128" y="85" class="sans" font-size="12.5" fill="#71717a">개인 프로젝트</text>
  <text x="28" y="114" class="sans" font-size="14" fill="#a1a1aa">보안 시나리오 기반 취약점 진단 · 공격 탐지 ·</text>
  <text x="28" y="134" class="sans" font-size="14" fill="#a1a1aa">침해사고 대응 시뮬레이터</text>

  <g transform="translate(70 172)">
    <line x1="0" y1="0" x2="360" y2="0" stroke="#2e2e33" stroke-width="1.5"/>
    <circle class="packet" cx="0" cy="0" r="3.5" fill="#4ade80"/>
    <g class="mono" font-size="10" letter-spacing="1.2" text-anchor="middle" fill="#71717a">
      <circle cx="0" cy="0" r="5" fill="#111113" stroke="#52525b" stroke-width="1.5"/>
      <text x="0" y="24">ATTACK</text>
      <circle cx="120" cy="0" r="5" fill="#111113" stroke="#52525b" stroke-width="1.5"/>
      <text x="120" y="24">DETECT</text>
      <circle cx="240" cy="0" r="5" fill="#111113" stroke="#52525b" stroke-width="1.5"/>
      <text x="240" y="24">ANALYZE</text>
      <circle cx="360" cy="0" r="5" fill="#4ade80"/>
      <text x="360" y="24" fill="#fafafa">RESPOND</text>
    </g>
  </g>

  <!-- ABOUT -->
  <g transform="translate(536 0)">
    <rect x="0.5" y="0.5" width="303" height="219" rx="18" fill="#111113" stroke="#26262a"/>
    <text x="26" y="40" class="mono label">ABOUT</text>
    <text x="26" y="76" class="sans k">School</text>
    <text x="26" y="97" class="sans v">중부대 정보보호학전공</text>
    <text x="26" y="128" class="sans k">Focus</text>
    <text x="26" y="149" class="sans v">보안 분석 · 침해사고 대응</text>
    <text x="26" y="180" class="sans k">Certificate</text>
    <text x="26" y="201" class="sans v">네트워크관리사 2급</text>
  </g>

  <!-- LEARNING -->
  <g transform="translate(0 236)">
    <rect x="0.5" y="0.5" width="411" height="173" rx="18" fill="#111113" stroke="#26262a"/>
    <text x="28" y="38" class="mono label">LEARNING</text>
    <text x="384" y="38" text-anchor="end" class="sans" font-size="11.5" fill="#52525b">수업에서 기초를 배우는 중</text>
    <g class="mono" font-size="11.5" text-anchor="middle" fill="#d4d4d8">
      <rect class="chip" x="28" y="68" width="36" height="28" rx="8"/><text x="46" y="86">C</text>
      <rect class="chip" x="72" y="68" width="70" height="28" rx="8"/><text x="107" y="86">Python</text>
      <rect class="chip" x="150" y="68" width="56" height="28" rx="8"/><text x="178" y="86">Java</text>
      <rect class="chip" x="214" y="68" width="96" height="28" rx="8"/><text x="262" y="86">JavaScript</text>
      <rect class="chip" x="28" y="108" width="96" height="28" rx="8"/><text x="76" y="126">TypeScript</text>
      <rect class="chip" x="132" y="108" width="84" height="28" rx="8"/><text x="174" y="126">Suricata</text>
      <rect class="chip" x="224" y="108" width="112" height="28" rx="8"/><text x="280" y="126">OWASP Top 10</text>
    </g>
  </g>

  <!-- COURSEWORK -->
  <g transform="translate(428 236)">
    <rect x="0.5" y="0.5" width="411" height="173" rx="18" fill="#111113" stroke="#26262a"/>
    <text x="28" y="38" class="mono label">COURSEWORK</text>
    <text x="28" y="76" class="sans" font-size="15" font-weight="600" fill="#fafafa">SecureGuard</text>
    <text x="384" y="76" text-anchor="end" class="mono" font-size="10.5" fill="#52525b">2026-2 · TEAM</text>
    <text x="28" y="97" class="sans" font-size="12.5" fill="#a1a1aa">워게임으로 OWASP Top 10을 배우는 사이트</text>
    <line x1="28" y1="116" x2="384" y2="116" stroke="#1f1f23"/>
    <text x="28" y="142" class="sans" font-size="15" font-weight="600" fill="#fafafa">Web-Pedia</text>
    <text x="384" y="142" text-anchor="end" class="mono" font-size="10.5" fill="#52525b">2026-1 · TEAM</text>
    <text x="28" y="163" class="sans" font-size="12.5" fill="#a1a1aa">웹 문법과 XSS · SQLi 개념을 다룬 학습 사이트</text>
  </g>
</svg>
