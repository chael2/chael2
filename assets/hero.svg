<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280">
  <style>
    .sans { font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
    .ln { opacity: 0; animation: show 9s infinite both; }
    .l1 { animation-delay: .2s } .l2 { animation-delay: 1.2s } .l3 { animation-delay: 2.2s }
    .l4 { animation-delay: 3.2s } .l5 { animation-delay: 4.2s }
    @keyframes show { 0% { opacity: 0 } 4% { opacity: 1 } 82% { opacity: 1 } 90% { opacity: 0 } 100% { opacity: 0 } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>

  <rect x="0.5" y="0.5" width="839" height="279" rx="20" fill="#111113" stroke="#26262a"/>

  <!-- left -->
  <circle class="pulse" cx="52" cy="64" r="3.5" fill="#4ade80"/>
  <text x="64" y="68" class="mono" font-size="11" letter-spacing="2" fill="#8a8a93">SECURITY ANALYSIS · INCIDENT RESPONSE</text>

  <text x="46" y="138" class="sans" font-size="64" font-weight="700" letter-spacing="-2.5" fill="#fafafa">chael2</text>

  <text x="48" y="178" class="sans" font-size="15.5" fill="#a1a1aa">로그 속 이상 징후를 찾고,</text>
  <text x="48" y="200" class="sans" font-size="15.5" fill="#a1a1aa">사고에 대응하는 법을 배우고 있어요.</text>

  <g class="sans" font-size="12" font-weight="500" fill="#d4d4d8" text-anchor="middle">
    <rect x="48" y="224" width="118" height="28" rx="14" fill="none" stroke="#2e2e33"/>
    <text x="107" y="242">중부대 정보보호학</text>
    <rect x="174" y="224" width="82" height="28" rx="14" fill="none" stroke="#2e2e33"/>
    <text x="215" y="242">Detection</text>
    <rect x="264" y="224" width="136" height="28" rx="14" fill="none" stroke="#2e2e33"/>
    <text x="332" y="242">Incident Response</text>
  </g>

  <!-- right: terminal -->
  <g transform="translate(486 40)">
    <rect x="0.5" y="0.5" width="313" height="199" rx="12" fill="#0a0a0b" stroke="#26262a"/>
    <circle cx="20" cy="20" r="4" fill="#3f3f46"/>
    <circle cx="34" cy="20" r="4" fill="#3f3f46"/>
    <circle cx="48" cy="20" r="4" fill="#3f3f46"/>
    <text x="157" y="24" text-anchor="middle" class="mono" font-size="10.5" fill="#52525b">eve.json</text>
    <line x1="0" y1="38" x2="314" y2="38" stroke="#1f1f23"/>

    <g class="mono" font-size="11.5">
      <text x="18" y="64" fill="#52525b">$ tail -f eve.json</text>
      <text x="18" y="92" class="ln l1"><tspan x="18" fill="#71717a">ALERT</tspan><tspan x="100" fill="#d4d4d8">SQLi attempt</tspan><tspan x="222" fill="#52525b">10.0.0.23</tspan></text>
      <text x="18" y="114" class="ln l2"><tspan x="18" fill="#71717a">ALERT</tspan><tspan x="100" fill="#d4d4d8">port scan</tspan><tspan x="222" fill="#52525b">10.0.0.41</tspan></text>
      <text x="18" y="136" class="ln l3"><tspan x="18" fill="#71717a">TRIAGE</tspan><tspan x="100" fill="#d4d4d8">severity → high</tspan></text>
      <text x="18" y="158" class="ln l4"><tspan x="18" fill="#71717a">ANALYZE</tspan><tspan x="100" fill="#d4d4d8">same src, 3 hits</tspan></text>
      <text x="18" y="180" class="ln l5"><tspan x="18" fill="#4ade80">RESPOND</tspan><tspan x="100" fill="#fafafa">block 10.0.0.23</tspan></text>
    </g>
    <rect class="cursor" x="290" y="171" width="7" height="13" fill="#4ade80"/>
  </g>
</svg>
